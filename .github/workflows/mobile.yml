name: Mobile

# Every change to the app gets analyze and test. On main: iOS → TestFlight,
# Android → signed AAB as artifact. macOS minutes are free only for public repos.

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']

env:
  FLUTTER_VERSION: 3.47.5
  API_URL: ${{ vars.API_URL }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}

defaults:
  run:
    working-directory: apps/mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios:
    needs: check
    # Skipped until the variables API_URL and ASC_KEY_ID exist. Also needs ASC_ISSUER_ID and the
    # secrets ASC_KEY_P8, IOS_DEV_CERTIFICATE and IOS_DEV_CERTIFICATE_PASSWORD
    if: github.event_name != 'pull_request' && vars.API_URL != '' && vars.ASC_KEY_ID != ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Neuestes Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Wähle: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: ASC-API-Key ablegen
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8

      # Fixed development certificate for the archive. Without it Xcode creates a new one
      # on every run until the team hits Apple's certificate limit. Profiles and export stay automatic.
      - name: Signing-Zertifikat installieren
        env:
          IOS_DEV_CERTIFICATE: ${{ secrets.IOS_DEV_CERTIFICATE }}
          IOS_DEV_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEV_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$IOS_DEV_CERTIFICATE" ] || { echo "Secret IOS_DEV_CERTIFICATE fehlt"; exit 1; }
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_DEV_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/signing.p12" -P "$IOS_DEV_CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # Eindeutige, steigende Build-Nummer pro Lauf, TestFlight lehnt Duplikate ab.
      - name: Flutter-Build vorbereiten
        run: flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL --dart-define=SENTRY_DSN=$SENTRY_DSN --build-number=$GITHUB_RUN_NUMBER

      - name: Archive bauen
        working-directory: apps/mobile/ios
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ vars.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ vars.ASC_ISSUER_ID }}

      - name: Export & Upload zu TestFlight
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ vars.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ vars.ASC_ISSUER_ID }}

  android:
    needs: check
    # Skipped until the variable API_URL exists
    if: github.event_name != 'pull_request' && vars.API_URL != ''
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Ohne Secrets wird mit Debug-Keys signiert (nur zum Testen, nicht für Play).
      - name: Upload-Keystore ablegen
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          cat > key.properties <<EOT
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOT

      - name: App Bundle bauen
        run: flutter build appbundle --release --dart-define=API_URL=$API_URL --dart-define=SENTRY_DSN=$SENTRY_DSN --build-number=$GITHUB_RUN_NUMBER

      - uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
