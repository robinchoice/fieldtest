name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs of one branch queue up, so an older deploy never overwrites a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Fails on high and critical advisories, lower ones only show up in the log
      - run: bun audit --audit-level=high
      - id: playwright
        run: |
          echo "version=$(grep -oP '"playwright": \["playwright@\K[^"]+' bun.lock)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # From apps/web, so bunx takes the Playwright version the tests use and not the latest from npm
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/web
      - run: bun run check
      # Builds the web app and tests the build
      - run: bun run test
      # The CLI as one file with the live URL baked in, built to check it compiles (README, „CLI“)
      - run: bun run build
        working-directory: apps/cli

  # Images are built here, not on VPS 1: building there ran it out of memory.
  # One job for both images: every job is billed in whole minutes.
  build-and-push:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The default docker driver cannot use the GitHub Actions layer cache
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: true
          platforms: linux/arm64
          provenance: false
          # /api/health and feedback report the commit, feedback files issues in this repo
          build-args: |
            APP_VERSION=${{ github.sha }}
            GITHUB_REPOSITORY=${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.prefix }}-api:latest
            ${{ steps.image.outputs.prefix }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/arm64
          provenance: false
          build-args: |
            APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.prefix }}-web:latest
            ${{ steps.image.outputs.prefix }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_UUID: ${{ secrets.COOLIFY_UUID }}
      COOLIFY_API: https://coolify.pleasance.org/api/v1
      # API_URL is the own domain from 1.0 on
      APP_URL: ${{ vars.API_URL || format('https://{0}.pleasance.org', github.event.repository.name) }}
    steps:
      - name: Deploy images to Coolify
        id: deploy
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "No COOLIFY_TOKEN secret yet, skipping deploy"
            exit 0
          fi
          : "${COOLIFY_UUID:?COOLIFY_UUID is required}"

          jq -n --arg prefix "ghcr.io/${GITHUB_REPOSITORY,,}" --arg sha "$GITHUB_SHA" \
            '{data: [
              {key: "IMAGE_PREFIX", value: $prefix, is_buildtime: true, is_runtime: true, is_preview: false},
              {key: "IMAGE_TAG", value: $sha, is_buildtime: true, is_runtime: true, is_preview: false}]}' |
            curl --fail-with-body --silent --show-error --output /dev/null \
              -X PATCH -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H 'Content-Type: application/json' --data-binary @- \
              "$COOLIFY_API/applications/$COOLIFY_UUID/envs/bulk"

          jq -n --arg sha "$GITHUB_SHA" --arg uuid "$COOLIFY_UUID" \
            '{git_commit_sha: $sha, is_auto_deploy_enabled: false,
              docker_compose_custom_build_command: "docker compose pull",
              docker_compose_custom_start_command: ("docker compose --project-name " + $uuid + " up -d --no-build --remove-orphans")}' |
            curl --fail-with-body --silent --show-error --output /dev/null \
              -X PATCH -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H 'Content-Type: application/json' --data-binary @- \
              "$COOLIFY_API/applications/$COOLIFY_UUID"

          deployment=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_API/deploy?uuid=$COOLIFY_UUID&force=true" |
            jq -er '.deployments[0].deployment_uuid')

          for _ in {1..60}; do
            status=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_API/deployments/$deployment" | jq -er '.status')
            echo "Deployment $deployment: $status"
            case "$status" in
              finished) break ;;
              failed|cancelled-by-user) exit 1 ;;
            esac
            sleep 10
          done
          if [ "$status" != finished ]; then
            echo 'Deployment timed out.' >&2
            exit 1
          fi

          # Coolify says finished once the containers run. Done means the public URL
          # serves this commit, which also catches a proxy route lost on recreate.
          for _ in {1..30}; do
            revision=$(curl --silent --max-time 10 "$APP_URL/api/health" | jq -r '.revision // empty' 2>/dev/null || true)
            echo "Public revision: ${revision:-none}"
            if [ "$revision" = "$GITHUB_SHA" ]; then
              echo deployed=true >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "$APP_URL/api/health does not serve $GITHUB_SHA" >&2
          exit 1

  # Photographs the live site (apps/web/screenshots.ts) and commits docs/screenshots
  # to main when the pictures changed. [skip ci] keeps that commit from deploying again.
  screenshots:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_URL: ${{ vars.API_URL || format('https://{0}.pleasance.org', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: playwright
        run: |
          echo "version=$(grep -oP '"playwright": \["playwright@\K[^"]+' bun.lock)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/web
      - run: bun run screenshots "$APP_URL"
        working-directory: apps/web
      - name: Commit the screenshots to main
        run: |
          set -euo pipefail
          mv docs/screenshots "$RUNNER_TEMP/screenshots"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # main may have moved on since this commit, a rejected push starts over from the new main
          for _ in 1 2 3; do
            git fetch --depth 1 origin main
            git checkout -f -B main FETCH_HEAD
            rm -rf docs/screenshots
            cp -r "$RUNNER_TEMP/screenshots" docs/screenshots
            git add -- docs/screenshots
            git diff --cached --quiet && exit 0
            git commit -m "docs: retake the screenshots for ${GITHUB_SHA::7} [skip ci]"
            git push origin main && exit 0
          done
          exit 1
      # Tells pleasance.org that the prototype is live with fresh screenshots.
      # A step, not its own job: every job is billed in whole minutes.
      - name: Send prototype-deployed to robinchoice/pleasance
        env:
          GH_TOKEN: ${{ secrets.PLEASANCE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "No PLEASANCE_DISPATCH_TOKEN secret yet, skipping"
            exit 0
          fi
          gh api repos/robinchoice/pleasance/dispatches \
            -f event_type=prototype-deployed \
            -f "client_payload[slug]=${GITHUB_REPOSITORY#*/}" \
            -f "client_payload[sha]=$GITHUB_SHA"
